---
- name: create prometheus group
  group:
    name: prometheus
    system: yes
    state: present

- name: create prometheus user
  user:
    name: prometheus
    group: prometheus
    system: yes
    shell: /usr/sbin/nologin
    create_home: no

- name: create prometheus config and data directories
  file:
    path: "{{ item }}"
    state: directory
    owner: prometheus
    group: prometheus
    mode: 0755
  loop:
    - /etc/prometheus
    - /var/lib/prometheus

- name: download and extract prometheus release
  unarchive:
    src: "https://github.com/prometheus/prometheus/releases/download/v{{ prometheus_version }}/prometheus-{{ prometheus_version }}.linux-amd64.tar.gz"
    dest: /opt
    remote_src: yes
    creates: "/opt/prometheus-{{ prometheus_version }}.linux-amd64"

- name: install prometheus and promtool binaries
  copy:
    src: "/opt/prometheus-{{ prometheus_version }}.linux-amd64/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    remote_src: yes
    owner: prometheus
    group: prometheus
    mode: 0755
  loop:
    - prometheus
    - promtool

    
- name: deploy prometheus.yml config
  copy:
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: 0644
    content: |
      global:
        scrape_interval: 15s

      scrape_configs:
        - job_name: "prometheus"
          static_configs:
            - targets: ["localhost:9091"]

- name: fix ownership of prometheus directories
  file:
    path: "{{ item }}"
    owner: prometheus
    group: prometheus
    recurse: yes
  loop:
    - /etc/prometheus
    - /var/lib/prometheus

- name: deploy prometheus systemd service
  copy:
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: 0644
    content: |
      [Unit]
      Description=Prometheus
      Wants=network-online.target
      After=network-online.target

      [Service]
      User=prometheus
      Group=prometheus
      Type=simple
      ExecStart=/usr/local/bin/prometheus \
        --config.file /etc/prometheus/prometheus.yml \
        --storage.tsdb.path /var/lib/prometheus/ \
        --web.listen-address=:9091

      [Install]
      WantedBy=multi-user.target
  notify: 
    - reload systemd
    - restart prometheus

- name: start and enable prometheus service
  systemd:
    name: prometheus
    daemon_reload: yes
    state: started
    enabled: true

- name: open firewall port 9091 (CentOS)
  firewalld:
    port: 9091/tcp
    permanent: yes
    immediate: yes
    state: enabled
  when: ansible_distribution == "CentOS"
